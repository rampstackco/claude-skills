# Distribution drift guard.
#
# Why this exists: a generated distribution is byte-compared against a fresh
# build by its builder's `--check` mode. That guard existed and worked, but
# nothing ran it automatically, so it had never once run in CI. A guard nobody
# runs catches nothing: dist/pi shipped 102 of 103 skills for an entire release
# cycle without a single red build (fixed in #104).
#
# DELIBERATE CONSEQUENCE, read before "fixing" a red run here:
#
#   A PR that edits skills/** WITHOUT rebuilding every dist WILL GO RED.
#
# That is the invariant working, not noise. A shipped distribution must move
# with its source in the same PR, otherwise the catalog on disk and the catalog
# users actually install drift apart silently, which is precisely the failure
# #104 had to clean up. The fix for a red run is to rebuild and commit the
# target named in the failing job:
#
#   node scripts/build-pi.mjs      && git add dist/pi    && git commit
#   node scripts/build-codex.mjs   && git add dist/codex && git commit
#
# Do NOT relax the path filters or add a skip to make this green. If a change
# genuinely must not touch a dist, say so explicitly in the PR.
#
# SCOPE: one matrix entry per distribution target that exists on main. dist/pi
# (scripts/build-pi.mjs) and dist/codex (scripts/build-codex.mjs, added by #88).
#
# TODO(dist-targets): extend the matrix to the Antigravity builder when PR #87
# (feat/port-antigravity) lands on main. That adds dist/antigravity along with
# its own builder. Until it merges there is nothing to check, and pre-wiring a
# step for a builder that does not exist yet would fail on a missing file and
# teach people to ignore this workflow. Add the matrix entry at that point, not
# before. Adding a target also means adding its builder to the paths filter
# below, otherwise the guard for that target never fires on a builder-only
# change.

name: Distribution drift

on:
  pull_request:
    paths:
      # Source: a skills change must be accompanied by a dist rebuild.
      - "skills/**"
      # The generated output itself.
      - "dist/**"
      # The builders, whose behaviour defines what a correct dist looks like.
      - "scripts/build-pi.mjs"
      - "scripts/build-codex.mjs"
      # The catalog manifest. build-codex.mjs checks the emitted skill set
      # against it, so a lock change can turn this guard red on its own.
      - "SKILLS.lock"
      # Line-ending policy: the guard byte-compares, so this is load-bearing.
      - ".gitattributes"
      # This workflow.
      - ".github/workflows/dist-drift.yml"

permissions:
  contents: read

jobs:
  dist:
    name: dist/${{ matrix.target }} matches a fresh build
    runs-on: ubuntu-latest
    strategy:
      # One red target must not hide the state of the others: if dist/pi is
      # stale, we still want to know whether dist/codex is too.
      fail-fast: false
      matrix:
        include:
          - target: pi
            builder: scripts/build-pi.mjs
          - target: codex
            builder: scripts/build-codex.mjs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Both builders are dependency-free (Node ESM, fs and path only), so there
      # is nothing to install and no lockfile to cache.
      - name: Drift check, committed dist/${{ matrix.target }} vs a fresh build
        run: node ${{ matrix.builder }} --check

      # Cheap (same traversal, no second build), so it runs unconditionally
      # rather than hiding behind a flag. Runs even when the drift check failed,
      # because "stale AND invalid" is more useful than "stale".
      - name: Validate emitted output against the ${{ matrix.target }} skill rules
        if: always()
        run: node ${{ matrix.builder }} --validate
